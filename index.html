<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Login Section -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full border border-slate-100">
            <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">Password</label>
                    <input type="password" id="adminPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-800 transition" placeholder="Enter admin password">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-full shadow-lg transition">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Section (Hidden by default) -->
    <div id="dashboardSection" class="hidden min-h-screen p-4 md:p-8">
        <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 text-white py-6 px-6 rounded-2xl shadow-md flex justify-between items-center mb-8">
            <h1 class="text-xl md:text-2xl font-bold">Alumni Admin Dashboard</h1>
            <button onclick="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-full transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
            </button>
        </header>

        <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-100 overflow-x-auto">
            <h2 class="text-lg font-bold mb-4 text-slate-700">Registered Alumni List</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-slate-700 text-sm border-b">
                        <th class="p-3">Membership No</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Batch</th>
                        <th class="p-3">Mobile</th>
                        <th class="p-3">District</th>
                        <th class="p-3">Panchayat / Place</th>
                    </tr>
                </thead>
                <tbody id="alumniTableBody" class="text-sm divide-y divide-slate-100">
                    <!-- Data will load here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://fpirwwpjlpkhrydpovrd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Bi-y74T38y3jjrXNvC1A_VKekxyIN';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Admin Password
        const ADMIN_PASS = "admin123"; 

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;

            if (pass === ADMIN_PASS) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadAlumniData();
            } else {
                alert('Incorrect password!');
            }
        });

        async function loadAlumniData() {
            const { data, error } = await _supabase
                .from('alumni')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching data:', error);
                alert('Failed to load data: ' + error.message);
                return;
            }

            const tbody = document.getElementById('alumniTableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">No records found.</td></tr>`;
                return;
            }

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-medium">${row.membership_no || ''}</td>
                    <td class="p-3">${row.full_name || ''}</td>
                    <td class="p-3">${row.batch || ''}</td>
                    <td class="p-3">${row.mobile_number || ''}</td>
                    <td class="p-3">${row.district || ''}</td>
                    <td class="p-3">${row.panchayat_municipality || row.place || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function logout() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
        }
    </script>
</body>
</html>
